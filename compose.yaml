services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stamp_app
      POSTGRES_PASSWORD: stamp_dev_only
      POSTGRES_DB: stamp_collection
    volumes:
      - stamp_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

volumes:
  stamp_postgres_data: